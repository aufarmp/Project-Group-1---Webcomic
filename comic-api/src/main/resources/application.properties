spring.application.name=comic-api
server.port=8080

# Koneksi ke Database (Sesuaikan nama DB dengan phpMyAdmin Anda: db_komik)
spring.datasource.url=jdbc:mysql://localhost:3306/db_komik?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Konfigurasi JPA (Agar nama tabel tidak berubah jadi huruf kecil semua)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl